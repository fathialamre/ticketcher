name: ticketcher
description: "A Flutter package for creating beautiful ticket-style cards with customizable borders, dividers, and patterns. Perfect for event tickets, boarding passes, and coupons."
version: 2.3.0
homepage: https://github.com/fathialamre/ticketcher
repository: https://github.com/fathialamre/ticketcher
topics:
  - ticket
  - coupon
  - custom-clipper
  - boarding-pass
  - event-ticket

screenshots:
  - description: "Ticketcher tickets, passes and coupons"
    path: screenshots/readme/cover.png
  - description: "FlipTicketcher: two-sided ticket that flips in 3D"
    path: screenshots/readme/flip.png
  - description: "TicketStamp: ink stamps in seven shapes"
    path: screenshots/readme/stamps.png
  - description: "Right-to-left Arabic ticket with a seal stamp"
    path: screenshots/readme/rtl.png
  - description: "Four notch shapes"
    path: screenshots/readme/notch_shapes.png
  - description: "Frosted glass blur effect"
    path: screenshots/readme/blur.png

environment:
  sdk: ^3.7.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
